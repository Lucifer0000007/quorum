[project]
name = "quorum"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/render_status.py" = ["E501"]  # long prose sentences for docs/STATUS.md

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live FalkorDB with the ingested graph"]
addopts = "-q"
